version: 1
default_environment: dev
project_id: 019fb7e1-cf71-7bc9-906e-ecdf887407e6
environments:
- name: dev
- name: staging
- name: prod
plugins:
  extractors:
  - name: tap-csv
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-csv.git
    config:
      files:
      - entity: ad_impressions
        path: data/ad_impressions.csv
        keys:
        - impression_id
  loaders:
  - name: target-postgres
    variant: meltanolabs
    pip_url: meltanolabs-target-postgres
    config:
      host: localhost
      port: 5433
      user: meltano
      default_target_schema: raw
      database: warehouse
  utilities:
  - name: dbt-postgres
    variant: dbt-labs
    pip_url: dbt-core dbt-postgres meltano-dbt-ext~=0.5.0
    config:
      host: localhost
      port: 5433
      user: meltano
      dbname: warehouse
      schema: analytics
